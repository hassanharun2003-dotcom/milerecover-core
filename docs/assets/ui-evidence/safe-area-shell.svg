<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720">
  <rect width="360" height="720" fill="#FAFAF8"/>
  <!-- Status bar inset -->
  <rect x="0" y="0" width="360" height="28" fill="#0B2E1F"/>
  <text x="180" y="18" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11">status bar inset (TabScreen paddingTop)</text>
  <!-- Content -->
  <rect x="16" y="40" width="328" height="88" rx="12" fill="#1B5538"/>
  <text x="180" y="78" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">Hero  never under status bar</text>
  <text x="180" y="100" text-anchor="middle" fill="#D8F3E4" font-family="sans-serif" font-size="11">gutter = spacing.md + max(insets.left/right)</text>
  <rect x="16" y="144" width="328" height="420" rx="8" fill="#fff" stroke="#D6E5DB"/>
  <text x="180" y="180" text-anchor="middle" fill="#1B5538" font-family="sans-serif" font-size="12">Scroll content (content-driven height)</text>
  <text x="180" y="210" text-anchor="middle" fill="#5C6B63" font-family="sans-serif" font-size="11">FixedHeaderScrollScreen header is outside ScrollView</text>
  <!-- Tab bar -->
  <rect x="0" y="620" width="360" height="100" fill="#fff" stroke="#D6E5DB"/>
  <text x="45" y="655" text-anchor="middle" fill="#1B5538" font-family="sans-serif" font-size="10"> Home</text>
  <text x="135" y="655" text-anchor="middle" fill="#6B7280" font-family="sans-serif" font-size="10"> Review</text>
  <text x="225" y="655" text-anchor="middle" fill="#6B7280" font-family="sans-serif" font-size="10">=Ä Proof</text>
  <text x="315" y="655" text-anchor="middle" fill="#6B7280" font-family="sans-serif" font-size="10">: Profile</text>
  <rect x="0" y="680" width="360" height="40" fill="#E8F5EE"/>
  <text x="180" y="704" text-anchor="middle" fill="#1B5538" font-family="sans-serif" font-size="11">system nav inset (tabBar paddingBottom)</text>
</svg>
