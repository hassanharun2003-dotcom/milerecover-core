name: Prototype Android JVM Tests

on:
  push:
    branches:
      - milestone/android-validation
    paths:
      - 'prototypes/android-tracking/**'
      - '.github/workflows/prototype-android-jvm.yml'
  pull_request:
    paths:
      - 'prototypes/android-tracking/**'
      - '.github/workflows/prototype-android-jvm.yml'

concurrency:
  group: prototype-android-jvm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm-unit-tests:
    name: Android unit tests (Robolectric)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/android-tracking
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version 8.2
            else
              echo "::error::gradlew missing and Gradle not installed on runner"
              exit 1
            fi
          fi
          chmod +x gradlew

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-android-jvm-test-reports
          path: |
            prototypes/android-tracking/app/build/reports/tests/
            prototypes/android-tracking/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
