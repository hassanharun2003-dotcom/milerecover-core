name: Package 3 domain tests

on:
  pull_request:
  push:
    branches:
      - main
      - milestone/**

permissions:
  contents: read

jobs:
  domain-tests:
    name: Domain logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install domain dependencies
        working-directory: packages/domain
        run: npm install
      - name: Typecheck
        working-directory: packages/domain
        run: npm run typecheck
      - name: Test
        working-directory: packages/domain
        run: npm test
