name: Prototype C iOS Simulator Validation

on:
  push:
    branches:
      - main
      - milestone/ios-readiness
    paths:
      - 'prototypes/native-bridge/ios/**'
      - 'prototypes/native-bridge/contract/**'
      - 'prototypes/native-bridge/src/**'
      - 'prototypes/native-bridge/__tests__/**'
      - 'prototypes/native-bridge/package.json'
      - 'prototypes/native-bridge/package-lock.json'
      - '.github/workflows/prototype-c-ios-simulator.yml'
  pull_request:
    paths:
      - 'prototypes/native-bridge/ios/**'
      - 'prototypes/native-bridge/contract/**'
      - 'prototypes/native-bridge/src/**'
      - 'prototypes/native-bridge/__tests__/**'
      - 'prototypes/native-bridge/package.json'
      - 'prototypes/native-bridge/package-lock.json'
      - '.github/workflows/prototype-c-ios-simulator.yml'

concurrency:
  group: prototype-c-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-validation:
    name: Node contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/native-bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: prototypes/native-bridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Contract tests
        run: npm run test:contract

      - name: Privacy tests
        run: npm run test:privacy

      - name: Upload node test summary
        if: always()
        run: |
          mkdir -p harness/output
          npm run typecheck 2>&1 | tee harness/output/ci-typecheck.log || true
          npm run test:contract 2>&1 | tee harness/output/ci-contract-test.log || true

      - name: Upload node validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-c-node-validation-log
          path: |
            prototypes/native-bridge/harness/output/ci-typecheck.log
            prototypes/native-bridge/harness/output/ci-contract-test.log
          if-no-files-found: ignore
          retention-days: 14

  ios-simulator-build:
    name: iOS simulator build (unsigned)
    runs-on: macos-latest
    needs: node-validation
    defaults:
      run:
        working-directory: prototypes/native-bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: prototypes/native-bridge/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Check iOS scaffold readiness
        id: scaffold
        run: |
          if [ -f ios/Podfile ] && ls ios/*.xcodeproj 1>/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::iOS RN scaffold missing (Podfile / xcodeproj). See ios/IOS_CLOUD_BUILD_READINESS.md"
          fi

      - name: Install CocoaPods
        if: steps.scaffold.outputs.ready == 'true'
        run: |
          set -euo pipefail
          cd ios
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods --no-document
          fi
          pod install --repo-update 2>&1 | tee ../pod-install.log
          pod_status=${PIPESTATUS[0]}
          if [ "$pod_status" -ne 0 ]; then
            echo "::error::pod install failed with exit code $pod_status"
            exit "$pod_status"
          fi
          test -d MileRecoverProtoBridgeC.xcworkspace
          test -f Podfile.lock

      - name: Build for iOS Simulator (unsigned)
        if: steps.scaffold.outputs.ready == 'true'
        run: |
          set -euo pipefail
          WS="ios/MileRecoverProtoBridgeC.xcworkspace"
          SCHEME="MileRecoverProtoBridgeC"
          set +e
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee ios-simulator-build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ] || grep -q "BUILD FAILED" ios-simulator-build.log; then
            echo "::error::Unsigned simulator app build failed (exit ${build_status})"
            grep -E "error:|fatal error:|BUILD FAILED" ios-simulator-build.log | tail -n 40 || true
            exit 65
          fi

      - name: Run Package 2 logic XCTest (hostless)
        if: steps.scaffold.outputs.ready == 'true'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          SIM_LINE="$(xcrun simctl list devices available | grep -m1 "iPhone" || true)"
          if [ -z "${SIM_LINE}" ]; then
            echo "::error::No iPhone simulator available"
            exit 1
          fi
          SIM_UDID="$(echo "${SIM_LINE}" | sed -nE 's/.*\(([A-Fa-f0-9-]{36})\).*/\1/p')"
          SIM_NAME="$(echo "${SIM_LINE}" | sed -E 's/^[[:space:]]*//;s/ \([A-Fa-f0-9-]{36}\).*//')"
          echo "Using simulator: ${SIM_NAME} (${SIM_UDID})"
          xcrun simctl boot "${SIM_UDID}" 2>/dev/null || true
          set +e
          xcodebuild test \
            -project ios/MileRecoverProtoBridgeC.xcodeproj \
            -scheme MileRecoverProtoBridgeCLogicTests \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee ios-logic-test.log
          test_status=${PIPESTATUS[0]}
          set -e
          if [ "$test_status" -ne 0 ] || grep -qE "TEST FAILED|Testing failed" ios-logic-test.log; then
            echo "::error::Hostless logic XCTest failed (exit ${test_status})"
            grep -E "error:|failed on|TEST FAILED|Testing failed" ios-logic-test.log | tail -n 40 || true
            exit 65
          fi
          mkdir -p ios/ci-evidence/logs
          cp ios-logic-test.log ios/ci-evidence/logs/simulator-test.log
          node ios/scripts/write-package-2-summary.cjs \
            --branch "${GITHUB_REF_NAME}" \
            --build-log ios-simulator-build.log \
            --test-log ios-logic-test.log \
            --out ios/ci-evidence/package-2-validation-summary.json
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Record scaffold blocker
        if: steps.scaffold.outputs.ready != 'true'
        run: |
          mkdir -p harness/output
          echo '{"status":"blocked","reason":"Missing Podfile and/or xcodeproj — RN iOS scaffold required"}' > harness/output/ios-ci-blocker.json

      - name: Swift syntax check (fallback when scaffold missing)
        if: steps.scaffold.outputs.ready != 'true'
        run: |
          set +e
          LOG=ios-swift-syntax.log
          : > "$LOG"
          for f in ios/PrototypeBridge/*.swift; do
            echo "Checking $f" | tee -a "$LOG"
            xcrun swiftc -typecheck "$f" 2>> "$LOG"
          done
          echo "Swift standalone typecheck attempted — full RN linkage requires scaffold" >> "$LOG"

      - name: Upload iOS build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-c-ios-build-logs
          path: |
            prototypes/native-bridge/ios-simulator-build.log
            prototypes/native-bridge/ios-logic-test.log
            prototypes/native-bridge/pod-install.log
            prototypes/native-bridge/ios-swift-syntax.log
            prototypes/native-bridge/harness/output/ios-ci-blocker.json
            prototypes/native-bridge/ios/ci-evidence/package-2-validation-summary.json
            prototypes/native-bridge/ios/ci-evidence/logs/
          if-no-files-found: ignore
          retention-days: 14
